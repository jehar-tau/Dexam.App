name: Deploy staging backend

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: Choose the normal release path or deliberately rebuild fictional staging from migrations.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rebuild-fictional-staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply verified staging release
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}

    steps:
      - name: Check out verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets
        shell: bash
        env:
          ACTION_TOKEN_PEPPER: ${{ secrets.ACTION_TOKEN_PEPPER }}
          STAGING_SYNTHETIC_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$ACTION_TOKEN_PEPPER"
          test -n "$STAGING_SYNTHETIC_PASSWORD"

      - name: Link staging project
        run: pnpm supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Rebuild fictional staging from migrations
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rebuild-fictional-staging'
        shell: bash
        run: |
          test "$SUPABASE_PROJECT_ID" = "ienwcencjbgdsqxfyxmj"
          echo "STAGING_REBUILD_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          pnpm supabase db reset \
            --linked \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-seed \
            --yes

      - name: Preview pending migrations
        run: pnpm supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply migrations
        run: pnpm supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Enforce database advisor gate
        shell: bash
        run: |
          advisor_file="$(mktemp)"
          trap 'rm -f "$advisor_file"' EXIT
          pnpm exec supabase db advisors \
            --linked \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --type all \
            --level info \
            --fail-on none \
            --output-format json > "$advisor_file"
          node scripts/staging/validate-advisor-findings.mjs "$advisor_file"

      - name: Configure server-only function secret
        env:
          ACTION_TOKEN_PEPPER: ${{ secrets.ACTION_TOKEN_PEPPER }}
        run: pnpm supabase secrets set ACTION_TOKEN_PEPPER="$ACTION_TOKEN_PEPPER" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy declared Edge Functions
        shell: bash
        run: |
          shopt -s nullglob
          function_entries=(supabase/functions/*/index.ts)
          test "${#function_entries[@]}" -gt 0

          for function_entry in "${function_entries[@]}"; do
            function_name="$(basename "$(dirname "$function_entry")")"

            for attempt in 1 2 3; do
              if pnpm supabase functions deploy "$function_name" \
                --project-ref "$SUPABASE_PROJECT_ID"; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Edge Function deployment failed after ${attempt} attempts: ${function_name}" >&2
                exit 1
              fi

              retry_delay=$((attempt * 10))
              echo "Retrying ${function_name} in ${retry_delay} seconds (attempt $((attempt + 1)) of 3)." >&2
              sleep "$retry_delay"
            done
          done

      - name: Prepare job-scoped API keys
        shell: bash
        run: |
          api_keys_file="$(mktemp)"
          trap 'rm -f "$api_keys_file"' EXIT
          pnpm supabase projects api-keys \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --reveal \
            --output json > "$api_keys_file"
          node scripts/staging/prepare-api-keys.mjs "$api_keys_file"

      - name: Bootstrap fictional acceptance fixtures
        env:
          STAGING_SUPABASE_URL: https://${{ secrets.STAGING_PROJECT_ID }}.supabase.co
          STAGING_SYNTHETIC_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_PASSWORD }}
        run: pnpm staging:fixtures:bootstrap

      - name: Verify hosted synthetic authorization
        env:
          STAGING_SUPABASE_URL: https://${{ secrets.STAGING_PROJECT_ID }}.supabase.co
          STAGING_SYNTHETIC_PASSWORD: ${{ secrets.STAGING_SYNTHETIC_PASSWORD }}
        run: pnpm staging:fixtures:verify

      - name: Verify fictional staff MFA recovery
        env:
          STAGING_SUPABASE_URL: https://${{ secrets.STAGING_PROJECT_ID }}.supabase.co
          STAGING_STAFF_SECURITY_ACCEPTANCE: 'true'
        run: node scripts/staging/verify-staff-recovery.mjs

      - name: Record remote migration state
        run: pnpm supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Record successful rebuild rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rebuild-fictional-staging'
        shell: bash
        run: |
          test -n "$STAGING_REBUILD_STARTED_AT"
          elapsed_seconds=$(( $(date +%s) - STAGING_REBUILD_STARTED_AT ))
          echo "Fictional staging rebuild completed and verified in ${elapsed_seconds} seconds."
